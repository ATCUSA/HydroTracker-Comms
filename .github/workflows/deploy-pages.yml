name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/app-build-x1ts8h]
  workflow_dispatch:

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This is an offline safety log; a broken build must not reach a device
      # that is about to go out on the water.
      - name: Type check
        run: npm run check

      - name: Unit and integration tests
        run: npm test

      - name: Build
        env:
          # A project site is served from /<repo>, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # Pages is served from the gh-pages branch. Publishing by branch rather
      # than the Pages artifact API keeps the workflow within the permissions a
      # GITHUB_TOKEN actually has: creating a Pages site needs repository admin,
      # which the token does not carry.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd build
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages
